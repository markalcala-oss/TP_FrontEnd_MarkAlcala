<div class="row">
  <div class="col-md-4 mb-4">
    <app-formulario [juegoAEditar]="juegoSeleccionado" (onGuardar)="guardarJuego($event)"></app-formulario>
  </div>
  <div class="col-md-8">
    <div class="row row-cols-1 row-cols-md-2 g-3">
      <div class="col" *ngFor="let item of juegos">
        <app-card [juego]="item" (onEliminar)="eliminarJuego($event)" (onEditar)="seleccionarParaEditar($event)"></app-card>
      </div>
    </div>
  </div>
</div>
