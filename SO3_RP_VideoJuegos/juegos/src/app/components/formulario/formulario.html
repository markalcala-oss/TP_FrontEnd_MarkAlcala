<div class="card p-3 shadow-sm">
  <h4>{{ juego.id ? 'Editar' : 'Registrar' }} Videojuego</h4>
  <form (ngSubmit)="guardar()">
    <div class="mb-2">
      <label class="form-label">Título</label>
      <input type="text" class="form-control" [(ngModel)]="juego.titulo" name="titulo" required>
    </div>
    <div class="mb-2">
      <label class="form-label">Género</label>
      <input type="text" class="form-control" [(ngModel)]="juego.genero" name="genero">
    </div>
    <div class="mb-2">
      <label class="form-label">Plataforma</label>
      <input type="text" class="form-control" [(ngModel)]="juego.plataforma" name="plataforma">
    </div>
    <div class="mb-2">
      <label class="form-label">Precio</label>
      <input type="number" class="form-control" [(ngModel)]="juego.precio" name="precio" required>
    </div>
    <div class="mb-3">
      <label class="form-label">URL Imagen</label>
      <input type="text" class="form-control" [(ngModel)]="juego.imagenUrl" name="imagenUrl">
    </div>
    <button type="submit" class="btn btn-success w-100">
      {{ juego.id ? 'Actualizar' : 'Guardar' }}
    </button>
  </form>
</div>
