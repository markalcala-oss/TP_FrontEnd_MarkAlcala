<div style="max-width: 900px; margin: 30px auto; font-family: Arial, sans-serif; padding: 0 20px;">
  
  <h1>📚 Biblioteca Digital</h1>

  <!-- FORMULARIO DE REGISTRO (POST) -->
  <section style="background: #f4f6f8; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
    <h2>Registrar Nuevo Libro</h2>
    <form (ngSubmit)="guardar()" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
      
      <div>
        <label><b>Título:</b></label><br>
        <input type="text" [(ngModel)]="nuevoLibro.titulo" name="titulo" required style="width: 100%; padding: 8px; margin-top: 5px;">
      </div>

      <div>
        <label><b>Autor:</b></label><br>
        <input type="text" [(ngModel)]="nuevoLibro.autor" name="autor" required style="width: 100%; padding: 8px; margin-top: 5px;">
      </div>

      <div>
        <label><b>Año:</b></label><br>
        <input type="number" [(ngModel)]="nuevoLibro.anio" name="anio" required style="width: 100%; padding: 8px; margin-top: 5px;">
      </div>

      <div>
        <label><b>Género:</b></label><br>
        <input type="text" [(ngModel)]="nuevoLibro.genero" name="genero" required style="width: 100%; padding: 8px; margin-top: 5px;">
      </div>

      <div style="grid-column: span 2; margin-top: 10px;">
        <button type="submit" style="background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">
          Registrar Libro
        </button>
      </div>

    </form>
  </section>

  <!-- LISTADO DE LIBROS (GET) -->
  <section>
    <h2>Listado de Libros</h2>
    
    <table border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
      <thead style="background: #e9ecef;">
        <tr>
          <th style="padding: 10px;">Título</th>
          <th style="padding: 10px;">Autor</th>
          <th style="padding: 10px;">Año</th>
          <th style="padding: 10px;">Género</th>
        </tr>
      </thead>
      <tbody>
        @for (libro of libros; track libro.id || libro.titulo) {
          <tr>
            <td style="padding: 10px;">{{ libro.titulo }}</td>
            <td style="padding: 10px;">{{ libro.autor }}</td>
            <td style="padding: 10px;">{{ libro.anio }}</td>
            <td style="padding: 10px;">{{ libro.genero }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" style="padding: 15px; text-align: center; color: #6c757d;">
              No hay libros registrados aún.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </section>

</div>
